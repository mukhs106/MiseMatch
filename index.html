<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="mise &amp; match: adapt familiar Indian and South Asian dishes to your pantry, portions and needs, and see what changes before you cook.">
    <meta name="theme-color" content="#ffffff">
    <title>mise &amp; match</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23000'/%3E%3C/svg%3E">
    <link rel="preload" href="fonts/ApfelGrotezk-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens.css">
    <link rel="stylesheet" href="css/flow.css">
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="app-header">
      <!-- Working typographic wordmark (styled in base.css). Editable; not a final logo. -->
      <a class="wordmark" href="#/" aria-label="mise &amp; match, Today">mise<span class="wordmark-amp" aria-hidden="true">&amp;</span>match</a>
      <!-- Three primary destinations: bottom tab bar on small screens, in the header on wide ones. -->
      <nav id="nav" class="tabbar" aria-label="Main"></nav>
      <a class="avatar" href="#/profile" aria-label="Requirements and settings"><img class="icon" src="assets/icons/user.svg" width="20" height="20" alt="" aria-hidden="true"></a>
    </header>
    <div id="notices" class="notices"></div>
    <main id="app" tabindex="-1"><div class="page"><p id="boot-status">Loading…</p></div></main>
    <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
    <div id="live" class="visually-hidden" role="status" aria-live="polite"></div>
    <dialog id="sheet" class="sheet"></dialog>
    <noscript><p style="padding:1rem">mise &amp; match needs JavaScript to run.</p></noscript>
    <script>
      // If the app's code can't load, say so instead of leaving a blank shell. Saved data isn't touched.
      function bootFailed() {
        if (window.__miseBooted) return;
        document.getElementById("app").innerHTML = '<div class="page"><h1 tabindex="-1">The app couldn\'t load</h1><p>Your saved data in this browser hasn\'t been changed. Check your connection and reload.</p><p><a class="btn btn--secondary" href="">Reload</a></p></div>';
      }
      window.addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") bootFailed(); }, true);
      window.addEventListener("unhandledrejection", function () { setTimeout(bootFailed, 0); });
      window.addEventListener("load", function () { setTimeout(bootFailed, 4000); });
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
